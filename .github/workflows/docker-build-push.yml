name: Build and Push Docker Image

on:
  push:
    branches:
      - kubernetes-deployment
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: news-app-deployment
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/krishnateja-81/news-app:${{ env.IMAGE_TAG }}

      - name: Update Kubernetes image tag
        run: |
          sed -i "s|image: ghcr.io/krishnateja-81/news-app:.*|image: ghcr.io/krishnateja-81/news-app:${IMAGE_TAG}|" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update image tag to ${IMAGE_TAG}"
            git push
          fi
