apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: news-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/krishnateja-81/News-App.git
    targetRevision: kubernetes-deployment
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: news-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
